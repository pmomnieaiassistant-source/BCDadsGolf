name: Database migrate

# Runs the SQL files in supabase/migrations/ against the live Supabase project.
# Start it by hand (Actions tab) or from a Claude Code session, AFTER Paul has approved the change.
# Leave dry_run on to only list what would run; turn it off to apply.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would run. Changes nothing.'
        type: boolean
        default: true
      baseline_version:
        description: 'One-time setup: mark this migration (14-digit version) as already applied. No SQL runs.'
        type: string
        default: ''

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: qwamevditxxxnlndyfih
      DRY_RUN: ${{ inputs.dry_run }}
      BASELINE: ${{ inputs.baseline_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0   # pinned: the flags below were tested on this version

      - name: Check the secrets are present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "SUPABASE_DB_PASSWORD is missing"; exit 1; }

      - name: Link to the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Mark baseline as already applied (one-time)
        if: ${{ inputs.baseline_version != '' && inputs.dry_run == false }}
        run: |
          [[ "$BASELINE" =~ ^[0-9]{14}$ ]] || { echo "baseline_version must be 14 digits"; exit 1; }
          supabase migration repair --status applied "$BASELINE" --remote --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Show which migrations are applied
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Preview what would run
        if: ${{ inputs.dry_run == true }}
        run: supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: ${{ inputs.dry_run == false }}
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Show the result
        if: ${{ inputs.dry_run == false }}
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"
