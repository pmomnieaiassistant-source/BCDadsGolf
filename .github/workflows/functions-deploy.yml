name: Deploy AI function

# Puts the AI assistant (supabase/functions/ai-assist) on the live Supabase project.
# Start it by hand (Actions tab) or from a Claude Code session, AFTER Paul has approved.
# set_key: also (re)sends the Anthropic API key from the GitHub secret ANTHROPIC_API_KEY to Supabase.
# Run the "Database migrate" workflow first if the migrations folder has new files.

on:
  workflow_dispatch:
    inputs:
      set_key:
        description: 'Also send the Anthropic API key (from the ANTHROPIC_API_KEY secret) to Supabase'
        type: boolean
        default: true

concurrency:
  group: functions-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROJECT_REF: qwamevditxxxnlndyfih
      SET_KEY: ${{ inputs.set_key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: node --test tests/ai-assist.test.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0   # pinned: the flags below were tested on this version

      - name: Check the secrets are present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          if [ "$SET_KEY" = "true" ]; then [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY is missing in GitHub secrets"; exit 1; }; fi

      - name: Link to the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Send the Anthropic key to Supabase
        if: ${{ inputs.set_key == true }}
        run: |
          umask 077
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > "$RUNNER_TEMP/fn.env"
          supabase secrets set --env-file "$RUNNER_TEMP/fn.env" --yes
          rm -f "$RUNNER_TEMP/fn.env"

      - name: Deploy the function
        run: supabase functions deploy ai-assist --use-api --no-verify-jwt --yes
