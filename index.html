<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5130">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BC Dads Golf</title>
<style>
:root{
  --bg:#f3f4f1; --card:#fff; --ink:#16211a; --ink2:#3d4b41; --muted:#6c7a70; --line:#e4e8e1;
  --green:#1f5130; --green2:#2e7a4a; --on-green:#fff; --soft:#edf2ea; --bubble:#f0f2ee;
  --ai:#eef3fc; --ai-line:#d6e2f6; --ai-ink:#2f5aa0; --like:#2e7a4a; --danger:#b3412f; --gold:#b8922a;
  --hdr:rgba(31,81,48,.94); --sheet-bg:rgba(10,16,12,.38);
  --shadow:0 1px 2px rgba(16,24,18,.05),0 6px 18px rgba(16,24,18,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1310; --card:#151d18; --ink:#e6ede8; --ink2:#c2cdc5; --muted:#8d9b91; --line:#232e28;
    --green:#3f8f5e; --green2:#62b382; --on-green:#06110a; --soft:#1b2620; --bubble:#1e2823;
    --ai:#132035; --ai-line:#24375a; --ai-ink:#93b6ee; --like:#62b382; --danger:#e57a66; --gold:#d8b24e;
    --hdr:rgba(16,40,25,.94); --sheet-bg:rgba(0,0,0,.55); --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden;overflow-x:clip}
body.tabs{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.composing{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg.i{width:var(--is,20px);height:var(--is,20px);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.muted{color:var(--muted)} .sm{font-size:13px} .hidden{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--hdr);color:#fff;
  backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px)}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.back{display:flex;align-items:center;gap:2px;color:#fff;font-weight:600;font-size:17px;margin-left:-6px;padding:4px 6px}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:999px;padding:3px}
.seg button{color:#fff;padding:6px 15px;border-radius:999px;font-weight:600;font-size:14px;opacity:.8;transition:background .2s,color .2s}
.seg button.on{background:#fff;color:#1f5130;opacity:1}

main{max-width:640px;margin:0 auto;padding:10px 10px 16px;overflow-x:clip} /* swipes slide things sideways; never let them widen the page */
.foot{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--green)}

/* avatars */
.av{width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;
  font-size:calc(var(--s)*.42);background:hsl(var(--h) 38% 42%);user-select:none}
.av.ai{background:linear-gradient(135deg,#4f7fd6,#7a5cd6);color:#fff}

/* feed */
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);transition:height .2s}
.ptr svg{transition:transform .2s}
.ptr.arm svg{transform:rotate(180deg);color:var(--green)}
.ptr.spin svg{animation:spin .8s linear infinite;color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
.prompt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left}
.prompt .ptext{flex:1;background:var(--bubble);border-radius:999px;padding:9px 14px;color:var(--muted)}
.prompt .i{color:var(--green)}
.feedbar{display:flex;justify-content:flex-end;position:relative;margin:-4px 0 4px}
.sortbtn{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;font-weight:600;padding:6px 6px;border-radius:10px}
.sortbtn:active{background:var(--soft)}
.menu{position:absolute;right:0;top:100%;z-index:15;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:200px;animation:menuIn .14s ease-out}
.menu .mh{font-size:12px;font-weight:700;color:var(--muted);padding:6px 12px 4px}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 12px;border-radius:10px;font-weight:600;font-size:15px;text-align:left}
.menu button:active{background:var(--soft)}
.sp-bg{position:fixed;inset:0;z-index:80;background:rgba(8,14,10,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s}
.sp-bg.in{opacity:1}
.sp-card{position:relative;background:var(--card);border-radius:26px;width:100%;max-width:380px;min-width:0;padding:28px 22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.35);transform:translateY(14px) scale(.97);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sp-bg.in .sp-card{transform:none}
.sp-card:focus{outline:none}
.sp-x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sp-x:active{background:var(--soft)}
.sp-kind{text-align:center;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--green);margin:0 36px 6px}
.sp-viewport{overflow:hidden;touch-action:pan-y}
.sp-track{display:flex;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sp-page{flex:0 0 100%;min-width:0;text-align:center;padding:8px 6px 4px;min-height:230px}
.sp-ic{width:68px;height:68px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;margin:8px auto 14px}
.sp-page h2{margin:0 0 8px;font-size:22px;line-height:1.25}
.sp-page p{margin:0;font-size:16px;line-height:1.5;color:var(--ink2);white-space:pre-line}
.sp-dots{display:flex;justify-content:center;gap:7px;margin:14px 0 12px}
.sp-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:width .25s,background .25s}
.sp-dots i.on{width:22px;border-radius:4px;background:var(--green)}
.sp-check{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:15px;color:var(--ink2);cursor:pointer;user-select:none}
.sp-check input{width:22px;height:22px;accent-color:var(--green);flex:none;margin:0}
.sp-next{width:100%;padding:13px;font-size:16px;margin-top:4px}
.lk{color:var(--green);font-weight:700;padding:6px 4px}.lk.muted{color:var(--muted)}
.inv{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.inv-t{flex:1;display:flex;flex-direction:column;line-height:1.3}
.menu .chk{color:var(--green)}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.post{background:var(--card);border-radius:18px;padding:14px 14px 6px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.post.full{cursor:default;border-radius:0 0 18px 18px;margin:-10px -10px 10px;padding-top:16px}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.p-who{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.p-who b{font-size:15px}
.p-who span{font-size:13px;color:var(--muted)}
.p-title{font-size:17px;margin:0 0 4px;line-height:1.3}
.p-body{margin:0 0 8px;white-space:pre-wrap;word-wrap:break-word;color:var(--ink2)}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ph{display:grid;gap:3px;border-radius:14px;overflow:hidden;margin:6px 0 8px}
.ph.n2,.ph.n3,.ph.n4{grid-template-columns:1fr 1fr}
.ph img{width:100%;height:100%;object-fit:cover;display:block;background:var(--soft)}
.ph.n1 img{max-height:420px}
.ph.n2 img,.ph.n3 img,.ph.n4 img{aspect-ratio:1}
.ph.n3 img:first-child{grid-row:span 2;aspect-ratio:auto}
.ph .more{position:relative}
.ph .more::after{content:attr(data-more);position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:22px;font-weight:700}
.teaser{display:flex;gap:7px;align-items:flex-start;background:var(--ai);color:var(--ink2);border-radius:12px;padding:8px 10px;font-size:14px;margin:4px 0 8px}
.teaser .i{color:var(--ai-ink);margin-top:2px}
.teaser span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-actions{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);margin:4px -6px 0;padding-top:2px}
.act{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;min-width:44px}
.act:active{background:var(--soft)}
.act.on{color:var(--like)}
.act.on svg{fill:currentColor}
.spacer{flex:1}
.p-last{display:flex;gap:8px;align-items:flex-start;padding:8px 0 8px;border-top:1px solid var(--line)}
.p-last p{margin:0;font-size:14px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--green);vertical-align:1px}
.chip.ready{background:#f6ecc9;color:#6d5410}.chip.building{background:#dce8fb;color:#22498c}.chip.built{background:var(--green);color:var(--on-green)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.burst{position:absolute;left:50%;top:50%;color:var(--like);pointer-events:none;animation:burst .7s ease forwards;z-index:3}
.burst svg{fill:currentColor;width:64px;height:64px}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:.95}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}

/* polls */
.poll{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0 8px;cursor:default}
.poll-q{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:4px}
.opt{position:relative;border-radius:10px;padding:9px 12px;margin:6px 0;overflow:hidden;display:flex;justify-content:space-between;gap:10px;background:var(--bubble);cursor:pointer;width:100%;text-align:left}
.opt .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--green) 18%,transparent);transition:width .35s}
.opt span{position:relative}
.opt.mine{font-weight:700;box-shadow:inset 0 0 0 2px var(--green)}

/* thread */
.slide-in{animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.ai-card{background:var(--ai);border:1px solid var(--ai-line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ai-head b{color:var(--ai-ink);font-size:14px}
.ai-card ul{margin:6px 0 0;padding-left:20px}
.ai-card li{margin:3px 0}
.ai-card ul.qa{list-style:none;padding-left:0}.ai-card .qa li{margin:0 0 6px;overflow-wrap:anywhere}.ai-card .qa b{font-weight:700}
.label{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ai-ink);margin-top:10px}
.ai-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.linkbtn{display:inline-flex;align-items:center;gap:5px;color:var(--ai-ink);font-weight:700}
.reading{display:inline-flex;align-items:center;gap:8px;color:var(--ai-ink)}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:3px;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.spec{background:var(--card);border-left:4px solid var(--gold)}
.srcnote{margin:0 0 6px;font-size:13px;color:var(--muted)}.srcnote .linkbtn{font-size:13px;text-align:left}
.spunlink{display:block;margin-top:4px;font-size:13px}
.spquote{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--line, #d8ddd6);color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.spin-check{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px}.spin-check input{width:20px;height:20px}
.switch-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:14px;background:#c9d0c8;position:relative;transition:background .15s;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--green)}.switch:checked::after{transform:translateX(20px)}.switch:disabled{opacity:.6}
.readybar{display:flex;align-items:center;gap:12px;justify-content:space-between}.readybar>div{min-width:0}.readybar .btn,.readybar .linkbtn{flex:none;white-space:nowrap}.readybar.ready{border-left:4px solid var(--gold)}.readybar.building{border-left:4px solid #22498c}
.admin{display:flex;align-items:center;gap:10px}
.admin select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.c-title{font-size:15px;margin:16px 4px 6px;color:var(--ink2)}
.comments{background:var(--card);border-radius:18px;padding:6px 10px 8px;box-shadow:var(--shadow);overflow-x:clip}
.c-row{position:relative;touch-action:pan-y;padding:6px 0}
.c-row.reply{margin-left:42px}
.c-main{display:flex;gap:8px;align-items:flex-start;transition:transform .2s ease;position:relative;z-index:1;background:var(--card)}
.c-col{min-width:0;flex:1}
.bubble{display:inline-block;max-width:100%;background:var(--bubble);border-radius:18px;padding:8px 12px;position:relative;word-wrap:break-word}
.bubble.ai{background:var(--ai);border:1px solid var(--ai-line)}
.bubble b{font-size:14px}
.bubble .tag{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--ai-ink);margin-left:4px}
.c-text{white-space:pre-wrap;font-size:15px}
.bubble .ph{margin:6px 0 2px;max-width:260px}
.c-meta{display:flex;gap:14px;font-size:13px;color:var(--muted);font-weight:600;padding:3px 12px 0}
.c-meta button{color:var(--muted);font-weight:600}
.c-meta button.on{color:var(--like)}
.c-likes{position:absolute;right:-6px;bottom:-9px;background:var(--card);border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:1px 6px;font-size:12px;display:flex;align-items:center;gap:3px;color:var(--like)}
.c-likes svg{fill:currentColor;--is:12px}
.sw{position:absolute;top:50%;transform:translateY(-50%) scale(.7);opacity:0;transition:opacity .15s,transform .15s;color:var(--muted)}
.sw.r{left:6px}.sw.l{right:6px;color:var(--danger)}
.c-row.arm-r .sw.r,.c-row.arm-l .sw.l{opacity:1;transform:translateY(-50%) scale(1);color:var(--green)}
.c-row.arm-l .sw.l{color:var(--danger)}
.morebtn{margin:2px 0 4px 42px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.morebtn::before{content:"";width:22px;height:1px;background:var(--muted)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.composer .inner{max-width:640px;margin:0 auto;min-width:0}
.replying{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 6px 6px}
.c-bar{display:flex;align-items:flex-end;gap:6px;min-width:0}
.icb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--green);flex:none}
.icb:active{background:var(--soft)}
#ctext{flex:1;min-width:0;width:100%;resize:none;border:1px solid var(--line);background:var(--bubble);border-radius:20px;padding:9px 14px;max-height:120px;line-height:1.35;outline:none}
.send{background:var(--green);color:var(--on-green)}
.send:disabled{opacity:.35}
.thumbs{display:flex;gap:6px;padding:0 4px 6px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:50;background:var(--sheet-bg);opacity:0;transition:opacity .22s}
.sheet-bg.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;
  padding:6px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet-bg.in .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-head h2{font-size:17px;margin:0}
.sh-head .cancel{color:var(--muted);font-weight:600}
.btn{background:var(--green);color:var(--on-green);border-radius:999px;padding:8px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--soft);color:var(--green)}
.field{width:100%;border:0;background:transparent;outline:none;padding:8px 2px}
.field.title{font-size:20px;font-weight:700}
textarea.field{min-height:120px;resize:none}
.sheet .row{display:flex;gap:8px;align-items:center}
.opt-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:5px 0;background:var(--bubble);outline:none}
.err{color:var(--danger);font-weight:600;font-size:14px;min-height:1em;margin:6px 0}

/* lightbox, toast, skeleton */
.lb{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.lb.in{opacity:1}
.lb img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--card);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:70;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* join, use, features */
.join{max-width:420px;margin:10vh auto 0;padding:0 6px}
.join h2{font-size:26px;margin:0 0 4px}
.join input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:6px 0;outline:none}
.join label{display:block;font-weight:700;font-size:14px;margin-top:12px}
.join .btn{width:100%;padding:13px;margin-top:12px;font-size:16px}
.use{text-align:center;padding:12vh 24px}
.use .flag{width:72px;height:72px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;margin:0 auto 14px}
.use h2{margin:0 0 6px}
.f-card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.f-card h3{margin:0 0 4px;font-size:16px}
.f-link{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-weight:700;font-size:14px;margin-top:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
'use strict';

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});
const app = document.getElementById('app');
const APP_VERSION = '0.5.13';
// feed: cached list; threads: cached idea pages; open: comment threads expanded; LK: like counts and whether I liked
const SORTS = { new: 'New', popular: 'Popular', top: 'Top all time' };
const savedSort = (() => { try { return localStorage.getItem('bdg.sort'); } catch (_) { return null; } })();
const S = { user: null, me: null, feed: null, sort: SORTS[savedSort] ? savedSort : 'popular', threads: {}, open: new Set(), replyTo: null, files: [], likesOn: true, feedScroll: 0, splashChecked: false };
const LK = { idea: new Map(), comment: new Map() };
// An invite link looks like  #/join/<secret>. The secret sits after the # so it is never sent to any server.
// It is kept in memory only, never saved, and wiped from the address bar as soon as it is used.
let INVITE = (location.hash.match(/^#\/join\/([A-Za-z0-9_-]{16,64})$/) || [])[1] || null;
function dropInvite() {
  INVITE = null;
  try { history.replaceState(null, '', location.pathname + location.search + '#/use'); } catch (_) { location.hash = '#/use'; }
}

// ---------- helpers
const $ = (q, el = document) => el.querySelector(q);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photoUrl = path => sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
const STATUS = { open: 'Open', ready: 'Ready to build', building: 'Building', built: 'Built' };
const chip = s => `<span class="chip ${esc(s)}">${esc(STATUS[s] || s)}</span>`;
const nameOf = row => row.is_ai ? 'Assistant' : (row.author?.name || 'Someone');
const uid = () => S.user?.id;
const toastFail = e => { console.error(e); toast(e?.message || 'Something went wrong. Please try again.'); };
const haptic = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} };

function ago(iso) {
  const d = new Date(iso), s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function hue(name) { let h = 7; for (const ch of String(name || '?')) h = (h * 31 + ch.codePointAt(0)) % 360; return h; }
function avatar(name, size = 40, ai = false) {
  if (ai) return `<span class="av ai" style="--s:${size}px">${icon('sparkle', Math.round(size * .5))}</span>`;
  const n = String(name || '?').trim();
  return `<span class="av" style="--s:${size}px;--h:${hue(n)}">${esc(([...n][0] || '?').toUpperCase())}</span>`;
}
const ICONS = {
  thumb: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  poll: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  sparkle: '<path d="M9.9 15.5A2 2 0 0 0 8.5 14l-6.1-1.6a.5.5 0 0 1 0-1L8.5 10A2 2 0 0 0 10 8.5l1.6-6.1a.5.5 0 0 1 1 0L14 8.5a2 2 0 0 0 1.5 1.5l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.5 1.5l-1.6 6.1a.5.5 0 0 1-1 0z"/>',
  reply: '<polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  refresh: '<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/>',
  down: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  ideas: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/>',
  star: '<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  flag: '<path d="M4 22V4"/><path d="M4 4h12l-2 4 2 4H4"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  userplus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  menu: '<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
};
const icon = (n, size) => `<svg class="i" ${size ? `style="--is:${size}px"` : ''} viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800);
}

// ---------- routing: #/use, #/create/ideas, #/create/ideas/<id>, #/create/features
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  return { mode: p[0] === 'create' ? 'create' : 'use', tab: p[1] === 'features' ? 'features' : 'ideas', id: p[0] === 'create' && (p[1] === 'ideas' || p[1] === 'features') ? (p[2] || null) : null };
}
// Where "back" goes from a discussion: the tab it was opened from.
function backHash() { return '#/create/' + (route().tab === 'features' ? 'features' : 'ideas'); }
// Navigate and re-render directly, so buttons work even in viewers that do not fire hashchange.
function go(h) {
  try { if (location.hash !== h) history.pushState(null, '', h); }
  catch (_) { location.hash = h; return; }
  if (S.me) render();
}
window.addEventListener('popstate', () => S.me && render());
window.addEventListener('hashchange', () => S.me && render());
window.addEventListener('scroll', () => { if ($('#feed')) S.feedScroll = window.scrollY; }, { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && !$('.sheet-bg')) render(); });
function storageOk() { try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return true; } catch (_) { return false; } }
const NO_STORAGE = `This browser is blocking saved sign-ins, so you will be logged out every time the page reloads. Open this page directly in Safari or Chrome (not in a private window, and not inside another app).`;

// ---------- the assistant (summaries and questions). Runs on the server; this just asks it and shows progress.
const aiPending = new Set(), aiNote = {};
async function askAI(ideaId, { manual = false, force = false } = {}) {
  if (aiPending.has(ideaId) || S.threads[ideaId]?.idea?.status === 'built') return; // built ideas are finished: no more summaries
  aiPending.add(ideaId); delete aiNote[ideaId];
  if (route().id === ideaId) rerenderThread();
  try {
    const { data, error } = await sb.functions.invoke('ai-assist', { body: { idea_id: ideaId, force } });
    if (error) {
      let msg = ''; try { msg = (await error.context.json()).error; } catch (_) {}
      throw new Error(msg || 'The assistant is not available right now.');
    }
    if (manual && data?.skipped === 'cooldown') aiNote[ideaId] = 'The assistant just looked at this. Try again in a minute.';
    if (manual && data?.skipped === 'nothing_new') aiNote[ideaId] = 'Nothing new since the last update.';
  } catch (e) { console.warn('assistant:', e.message); if (manual) aiNote[ideaId] = e.message; }
  finally { aiPending.delete(ideaId); if (S.me && route().id === ideaId) render(); }
}

// ---------- boot / join
async function boot() {
  let { data: { session } } = await sb.auth.getSession();
  if (session) {
    S.user = session.user;
    const { data, error } = await sb.from('members').select('*').eq('id', S.user.id).maybeSingle();
    if (data) { S.me = data; if (INVITE) dropInvite(); return render(); }
    // A failed lookup is not the same as "not joined": say so instead of asking for the code again.
    if (error) {
      app.innerHTML = `<main><div class="join card"><h2>Can't reach the group</h2>
        <p class="muted">Your sign-in is saved, but the app couldn't read your profile. Pull down to refresh. If it keeps happening, tell Paul and include this: ${esc(error.message)}</p>
        <button class="btn" onclick="location.reload()">Try again</button></div></main>`;
      return;
    }
  }
  joinScreen();
}

function joinScreen(msg, { code = false } = {}) {
  document.body.className = '';
  const viaInvite = !!INVITE && !code;
  app.innerHTML = `<main><div class="join">
    <div class="use" style="padding:0 0 10px"><div class="flag">${icon('flag', 34)}</div></div>
    <h2>${viaInvite ? "You're invited" : 'BC Dads Golf'}</h2>
    <p class="muted" style="margin:0">${viaInvite ? 'Pick the name the dads will see, then tap Join.' : 'Enter the group code and the name the dads will see.'}</p>
    ${viaInvite ? '' : '<label for="code">Group code</label><input id="code" type="text" autocomplete="off" autocapitalize="off">'}
    <label for="jname">Your name</label><input id="jname" type="text" maxlength="40" autocomplete="off" autocapitalize="words">
    <p class="err" id="jerr">${esc(msg || (storageOk() ? '' : NO_STORAGE))}</p>
    <button class="btn" id="join">Join</button>
    ${INVITE ? `<p style="text-align:center"><button class="lk" id="swap">${viaInvite ? 'I have a group code instead' : 'I have an invite link'}</button></p>` : ''}
    <p class="foot">BC Dads Golf v${APP_VERSION}</p></div></main>`;
  const swap = document.getElementById('swap');
  if (swap) swap.onclick = () => joinScreen('', { code: viaInvite });
  const nameEl = document.getElementById('jname');
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('join').click(); });
  document.getElementById('join').onclick = async (ev) => {
    const btn = ev.target, err = document.getElementById('jerr');
    err.textContent = ''; btn.disabled = true; btn.dataset.busy = '1';
    try {
      let { data: { session } } = await sb.auth.getSession();
      if (!session) {
        const r = await sb.auth.signInAnonymously();
        if (r.error) throw new Error(/anonymous/i.test(r.error.message) ? 'Anonymous sign-ins are switched off in Supabase. See the setup steps.' : r.error.message);
        session = r.data.session;
      }
      S.user = session.user;
      const { error } = viaInvite
        ? await sb.rpc('join_with_invite', { p_token: INVITE, p_name: nameEl.value })
        : await sb.rpc('join_group', { p_code: document.getElementById('code').value.trim(), p_name: nameEl.value });
      if (error) throw error;
      const { data } = await sb.from('members').select('*').eq('id', S.user.id).single();
      S.me = data; nameEl.value = '';
      if (INVITE) dropInvite(); else if (!location.hash) go('#/use');
      render();
    } catch (e) { err.textContent = e.message; btn.disabled = false; delete btn.dataset.busy; }
  };
}

// ---------- shell: header, page, bottom tabs or comment bar
function shell(r, inner, { thread = null } = {}) {
  document.body.className = thread ? 'composing' : (r.mode === 'create' ? 'tabs' : '');
  const left = thread
    ? `<button class="back" data-go="${backHash()}" aria-label="Back">${icon('back', 26)}<span>${r.tab === 'features' ? 'Features' : 'Ideas'}</span></button>`
    : `<h1>BC Dads Golf</h1>`;
  app.innerHTML = `<header class="top">${left}
    <div class="seg"><button data-go="#/use" class="${r.mode === 'use' ? 'on' : ''}">Use</button>
    <button data-go="#/create/ideas" class="${r.mode === 'create' ? 'on' : ''}">Build</button></div></header>
    <main>${storageOk() ? '' : `<div class="card err">${esc(NO_STORAGE)}</div>`}${inner}
    ${thread ? '' : `<p class="foot">BC Dads Golf v${APP_VERSION}</p>`}</main>
    ${thread ? composerHTML(thread) : r.mode === 'create' ? `<nav class="tabs">
      <button data-go="#/create/ideas" class="${r.tab === 'ideas' ? 'on' : ''}">${icon('ideas', 22)}Ideas</button>
      <button data-go="#/create/features" class="${r.tab === 'features' ? 'on' : ''}">${icon('star', 22)}Features</button></nav>` : ''}`;
}

async function render() {
  if (S.me && !S.splashChecked) { S.splashChecked = true; maybeShowSplash(); }
  const r = route();
  if (r.mode === 'use') {
    return shell(r, `<div class="use"><div class="flag">${icon('flag', 34)}</div><h2>Scoring is coming</h2>
      <p class="muted">Nothing to use yet. Head to Build to share ideas for how our golf scoring should work.</p>
      <button class="btn" data-go="#/create/ideas" style="margin-top:8px">Go to Build</button></div>`);
  }
  if (r.id) return renderThread(r.id);
  if (r.tab === 'features') return renderFeatures(r);
  return renderFeed(r);
}

// ---------- likes
function likeAct(kind, id) {
  if (!S.likesOn) return '';
  const s = LK[kind].get(id) || { n: 0, mine: false };
  return kind === 'idea'
    ? `<button class="act ${s.mine ? 'on' : ''}" data-like="idea:${id}" aria-label="Like">${icon('thumb')}<span>${s.n || ''}</span></button>`
    : `<button class="${s.mine ? 'on' : ''}" data-like="comment:${id}">Like</button>`;
}
function commentLikeBadge(id) {
  const s = LK.comment.get(id); if (!s || !s.n) return '';
  return `<span class="c-likes">${icon('thumb')}${s.n}</span>`;
}
function patchLike(kind, id) {
  const s = LK[kind].get(id) || { n: 0, mine: false };
  document.querySelectorAll(`[data-like="${kind}:${id}"]`).forEach(b => {
    b.classList.toggle('on', s.mine);
    if (kind === 'idea') b.querySelector('span').textContent = s.n || '';
  });
  if (kind === 'comment') {
    const bub = document.querySelector(`.c-row[data-cid="${id}"] .bubble`);
    if (bub) { bub.querySelector('.c-likes')?.remove(); bub.insertAdjacentHTML('beforeend', commentLikeBadge(id)); }
  }
}
async function toggleLike(kind, id, onlyLike = false) {
  if (!S.likesOn) return;
  const m = LK[kind], before = m.get(id) || { n: 0, mine: false };
  if (onlyLike && before.mine) return;
  const on = !before.mine;
  m.set(id, { n: Math.max(0, before.n + (on ? 1 : -1)), mine: on });
  patchLike(kind, id); haptic();
  document.querySelectorAll(`[data-like="${kind}:${id}"]`).forEach(b => { b.classList.remove('pop'); void b.offsetWidth; if (on) b.classList.add('pop'); });
  const table = kind === 'idea' ? 'idea_likes' : 'comment_likes', col = kind === 'idea' ? 'idea_id' : 'comment_id';
  const { error } = on
    ? await sb.from(table).insert({ [col]: id, member_id: uid() })
    : await sb.from(table).delete().eq(col, id).eq('member_id', uid());
  if (error && !(on && error.code === '23505')) { m.set(id, before); patchLike(kind, id); toast("Couldn't save your like. Try again."); }
}
function burst(el) {
  const b = document.createElement('span'); b.className = 'burst'; b.innerHTML = icon('thumb');
  if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
  el.appendChild(b); setTimeout(() => b.remove(), 750);
}
function setLikes(kind, rows, col) {
  const counts = new Map();
  for (const r of rows) {
    const s = counts.get(r[col]) || { n: 0, mine: false };
    s.n++; if (r.member_id === uid()) s.mine = true; counts.set(r[col], s);
  }
  return counts;
}

// ---------- photos and polls (shared by feed and threads)
function photosHTML(paths, zoom) {
  if (!paths.length) return '';
  const show = paths.slice(0, 4), n = show.length, extra = paths.length - 4;
  return `<div class="ph n${n}">${show.map((p, i) => {
    const u = esc(photoUrl(p));
    const more = i === 3 && extra > 0 ? ` class="more" data-more="+${extra}"` : '';
    return `<div${more}><img loading="lazy" src="${u}" alt="photo"${zoom ? ` data-lb="${u}"` : ''}></div>`;
  }).join('')}</div>`;
}
function pollHTML(p) {
  const votes = p.poll_votes || [], total = votes.length;
  const mine = votes.find(v => v.voter_id === uid())?.option_id;
  const canDel = p.created_by === uid() || S.me.is_admin;
  return `<div class="poll" data-stop>
    <div class="poll-q"><span>${icon('poll', 16)}</span><span style="flex:1">${esc(p.question)}</span>${canDel ? `<button data-delpoll="${p.id}" aria-label="Delete poll" class="muted">${icon('trash', 16)}</button>` : ''}</div>
    ${p.poll_options.map(o => {
      const n = votes.filter(v => v.option_id === o.id).length, pct = total ? Math.round(100 * n / total) : 0;
      return `<button class="opt ${mine === o.id ? 'mine' : ''}" data-vote="${p.id}|${o.id}"><span class="bar" style="width:${mine ? pct : 0}%"></span><span>${esc(o.label)}</span><span>${mine ? pct + '%' : ''}</span></button>`;
    }).join('')}
    <div class="muted sm">${total} vote${total === 1 ? '' : 's'}${mine ? ' · tap another option to change' : ' · tap to vote and see results'}</div></div>`;
}
async function vote(pollId, optionId) {
  haptic();
  const { error } = await sb.from('poll_votes').upsert({ poll_id: pollId, option_id: optionId, voter_id: uid() }, { onConflict: 'poll_id,voter_id' });
  if (error) return toastFail(error);
  const r = route();
  if (r.id) { await loadThread(r.id).catch(toastFail); rerenderThread(); } else refreshFeed();
}

// ---------- feed
async function loadFeed() {
  // Built ideas live under Features now, so they are not in this feed.
  const iq = await sb.from('ideas').select('*, author:members!author_id(name)').neq('status', 'built').order('created_at', { ascending: false }).limit(100);
  if (iq.error) throw iq.error;
  const ideas = iq.data, ids = ideas.map(i => i.id);
  let comments = [], atts = [], polls = [], likes = [];
  if (ids.length) {
    const [cq, aq, pq, lq] = await Promise.all([
      sb.from('comments').select('id,idea_id,body,is_ai,kind,created_at,author:members!author_id(name)').in('idea_id', ids).order('created_at', { ascending: false }).limit(1000),
      sb.from('attachments').select('idea_id,comment_id,path,created_at').in('idea_id', ids).is('comment_id', null).order('created_at'),
      sb.from('polls').select('id,idea_id,question,created_by,created_at,poll_options(id,label),poll_votes(option_id,voter_id)').in('idea_id', ids).order('created_at'),
      sb.from('idea_likes').select('idea_id,member_id').in('idea_id', ids),
    ]);
    for (const q of [cq, aq, pq]) if (q.error) throw q.error;
    comments = cq.data; atts = aq.data; polls = pq.data;
    S.likesOn = !lq.error; likes = lq.error ? [] : lq.data;
  }
  LK.idea = setLikes('idea', likes, 'idea_id');
  for (const i of ideas) {
    const cs = comments.filter(c => c.idea_id === i.id);
    i.ccount = cs.length; i.hcount = cs.filter(c => !c.is_ai).length; i.last = cs[0] || null;
    i.photos = atts.filter(a => a.idea_id === i.id).map(a => a.path);
    i.polls = polls.filter(p => p.idea_id === i.id);
    i.activity = i.last_activity_at || (cs[0] && cs[0].created_at > i.created_at ? cs[0].created_at : i.created_at);
  }
  S.feed = ideas;
}
function feedHTML() {
  const list = sortIdeas(S.feed || [], S.sort);
  return `<button class="prompt" data-act="new-idea">${avatar(S.me.name, 38)}<span class="ptext">What should the app do?</span>${icon('image', 22)}</button>
    <div class="feedbar">${S.me.is_admin ? `<button class="sortbtn" data-act="invite" style="margin-right:auto" aria-label="Invite someone">${icon('userplus', 18)}Invite</button>` : ''}<button class="sortbtn" data-act="sort-menu" aria-label="Sort posts" aria-haspopup="true">${esc(SORTS[S.sort])}${icon('menu', 18)}</button></div>
    ${list.length ? list.map(postCard).join('') : `<div class="empty">${icon('ideas', 40)}<p>No ideas here right now. Post one, or see what has been built on the Features tab.</p></div>`}`;
}
// New: newest first. Popular: likes and comments, fading as a post goes quiet (so fresh activity lifts it again).
// Top all time: most liked, then most discussed.
function sortIdeas(ideas, mode) {
  const likes = i => (LK.idea.get(i.id) || { n: 0 }).n;
  const t = iso => new Date(iso).getTime();
  const hot = i => (likes(i) + 2 * (i.hcount || 0) + 1) / Math.pow((Date.now() - t(i.activity || i.created_at)) / 36e5 + 2, 1.2);
  const cmp = {
    new: (a, b) => t(b.created_at) - t(a.created_at),
    popular: (a, b) => hot(b) - hot(a) || t(b.created_at) - t(a.created_at),

  }[mode] || ((a, b) => t(b.created_at) - t(a.created_at));

}

// ---------- thread (one idea and its discussion)
async function loadThread(id) {
  const [iq, aq, pq, cq, lq] = await Promise.all([
    sb.from('ideas').select('*, author:members!author_id(name)').eq('id', id).maybeSingle(),
    sb.from('attachments').select('*').eq('idea_id', id).order('created_at'),
    sb.from('polls').select('*, poll_options(id,label), poll_votes(option_id,voter_id)').eq('idea_id', id).order('created_at'),
    sb.from('comments').select('*, author:members!author_id(name)').eq('idea_id', id).order('created_at'),
    sb.from('idea_likes').select('idea_id,member_id').eq('idea_id', id),
  ]);
  for (const q of [iq, aq, pq, cq]) if (q.error) throw q.error;
  S.likesOn = !lq.error;
  if (!lq.error) LK.idea.set(id, setLikes('idea', lq.data, 'idea_id').get(id) || { n: 0, mine: false });
  const cids = cq.data.map(c => c.id);
  if (S.likesOn && cids.length) {
    const cl = await sb.from('comment_likes').select('comment_id,member_id').in('comment_id', cids);
    if (!cl.error) { const m = setLikes('comment', cl.data, 'comment_id'); cids.forEach(c => LK.comment.set(c, m.get(c) || { n: 0, mine: false })); }
  }
  let source = null;
  if (iq.data?.source_idea_id) { const si = await sb.from('ideas').select('id,title,status').eq('id', iq.data.source_idea_id).maybeSingle(); source = si.data || null; }
  S.threads[id] = { idea: iq.data, atts: aq.data, polls: pq.data, comments: cq.data, source };
}

    ${comments.length ? `<p class="hint">Swipe right on a comment to reply · double-tap to like</p>` : ''}`;

// ---------- photos
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}
async function uploadPhotos(files, ideaId, commentId) {
  for (const f of files) {
    const blob = await shrink(f);
    const path = `${uid()}/${crypto.randomUUID()}.jpg`;
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
    const { error } = await sb.from('attachments').insert({ idea_id: ideaId, comment_id: commentId || null, uploader_id: uid(), path });
    if (error) throw error;
  }
}
function lightbox(src) {
  const d = document.createElement('div'); d.className = 'lb';
  d.innerHTML = `<img src="${esc(src)}" alt="photo">`;
  document.body.appendChild(d); requestAnimationFrame(() => d.classList.add('in'));
  const img = d.firstElementChild;
  const close = () => { d.classList.remove('in'); setTimeout(() => d.remove(), 200); };
  let y0 = null, dy = 0;
  d.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; img.style.transition = 'none'; }, { passive: true });
  d.addEventListener('touchmove', e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; img.style.transform = `translateY(${dy}px)`; d.style.background = `rgba(0,0,0,${Math.max(.3, 1 - Math.abs(dy) / 400)})`; }, { passive: true });
  d.addEventListener('touchend', () => { img.style.transition = ''; if (Math.abs(dy) > 90) close(); else { img.style.transform = ''; d.style.background = ''; } y0 = null; });
  d.addEventListener('click', () => { if (Math.abs(dy) < 10) close(); });
}

function sheet(html) {

  const sh = bg.firstElementChild;
  const close = () => { bg.classList.remove('in'); setTimeout(() => bg.remove(), 260); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (!e.target.closest('.grab,.sh-head')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition = ''; if (dy > 100) close(); else sh.style.transform = ''; y0 = null; });
  return { el: sh, close };
}

      close(); await loadThread(id); rerenderThread();
      askAI(id, { force: true }); // a new poll is new content even though it is not a comment
    } catch (e) { $('#pe', el).textContent = e.message; b.disabled = false; }
    finally { delete b.dataset.busy; }
  };
}

// ---------- start a new idea from a comment (and its replies)
function spinSheet(cid) {
  const id = route().id, t = S.threads[id]; if (!t) return;
  const c = t.comments.find(x => x.id === cid); if (!c) return;
  const kids = new Set([cid]); let grew = true;
  while (grew) { grew = false; for (const x of t.comments) if (x.parent_id && kids.has(x.parent_id) && !kids.has(x.id)) { kids.add(x.id); grew = true; } }
  const nReplies = kids.size - 1;
  const first = c.body.replace(/\s+/g, ' ').trim();
  const guess = first.length > 60 ? first.slice(0, 57).replace(/\s+\S*$/, '') + '...' : first;
  const { el, close } = sheet(`<div class="sh-head"><button class="cancel" data-x>Cancel</button><h2>New idea</h2><button class="btn" id="spgo">Start</button></div>
    <p class="muted sm" style="margin-top:0">This starts a new idea from ${nReplies ? 'this comment and its replies' : 'this comment'}. The original conversation stays where it is, with a link to the new idea.</p>
    <blockquote class="spquote">${esc(first.length > 160 ? first.slice(0, 157) + '...' : first)}</blockquote>
    <input class="field title" id="spt" maxlength="140" placeholder="Give the new idea a title" autocomplete="off" value="${esc(guess)}">
    ${nReplies ? `<label class="spin-check"><input type="checkbox" id="spr" checked><span>Include the ${nReplies} repl${nReplies === 1 ? 'y' : 'ies'}</span></label>` : ''}
    <p class="err" id="spe"></p>`);
  $('[data-x]', el).onclick = close; setTimeout(() => { const i = $('#spt', el); i.focus(); i.select(); }, 260);
  $('#spgo', el).onclick = async ev => {
    const title = $('#spt', el).value.trim();
    if (title.length < 3) return $('#spe', el).textContent = 'Give it a title of at least 3 letters.';
    const b = ev.target; b.disabled = true; b.dataset.busy = '1';
    try {
      const { data, error } = await sb.rpc('spin_off', { p_comment_id: cid, p_title: title, p_include_replies: nReplies ? $('#spr', el).checked : false });
      if (error) throw error;
      S.feed = null; close(); toast('New idea started'); go('#/create/ideas/' + data);
    } catch (e) { $('#spe', el).textContent = e.message || 'Something went wrong. Try again.'; b.disabled = false; }
    finally { delete b.dataset.busy; }
  };
}

// ---------- invite links (admins)
const inviteUrl = tok => `${location.origin}${location.pathname}#/join/${tok}`;
function inviteSheet() {
  sheet(`<div class="sh-head"><button class="cancel" data-x>Done</button><h2>Invite someone</h2><span style="width:48px"></span></div>
    <p class="muted" style="margin-top:0">Make a link and text it to a friend. They open it, type their name and tap Join. You can cancel it any time.</p>
    <div class="row" style="align-items:flex-end;gap:10px;margin-bottom:10px">
      <label class="sm muted" style="flex:1">Works for<select class="opt-in" id="idays"><option value="1">1 day</option><option value="7" selected>7 days</option><option value="30">30 days</option></select></label>
      <label class="sm muted" style="flex:1">Up to<select class="opt-in" id="iuses"><option value="1">1 person</option><option value="5">5 people</option><option value="10" selected>10 people</option><option value="25">25 people</option></select></label></div>
    <button class="btn" data-act="invite-make" style="width:100%">Create invite link</button>
    <div id="inew"></div><p class="err" id="ierr"></p>
    <div class="label" style="color:var(--muted);margin-top:14px">Active links</div><div id="ilist"><p class="muted sm">Loading...</p></div>`);
  document.querySelector('.sheet-bg [data-x]').onclick = () => document.querySelector('.sheet-bg')?.click();
  loadInvites();
}
async function loadInvites() {
  const box = $('#ilist'); if (!box) return;
  const { data, error } = await sb.from('invites').select('token,created_at,expires_at,max_uses,uses')
    .eq('revoked', false).gt('expires_at', new Date().toISOString()).order('created_at', { ascending: false });
  if (!$('#ilist')) return;
  if (error) { $('#ilist').innerHTML = `<p class="muted sm">${esc(/invites|schema cache|permission/i.test(error.message) ? 'Invite links need a database update first.' : error.message)}</p>`; return; }
  $('#ilist').innerHTML = data.length ? data.map(i => `<div class="inv"><div class="inv-t"><b>${i.uses} of ${i.max_uses} used${i.uses >= i.max_uses ? ' (full)' : ''}</b>
      <span class="muted sm">Made ${ago(i.created_at) === 'now' ? 'just now' : ago(i.created_at) + ' ago'} · ends ${new Date(i.expires_at).toLocaleDateString([], { month: 'short', day: 'numeric' })}</span></div>
      <button class="lk" data-act="invite-share" data-tok="${esc(i.token)}">Share</button>
      <button class="lk muted" data-act="invite-revoke" data-tok="${esc(i.token)}">Cancel</button></div>`).join('') : '<p class="muted sm">No active links.</p>';
}
async function makeInvite(btn) {
  const err = $('#ierr'); err.textContent = ''; btn.disabled = true; btn.dataset.busy = '1';
  try {
    const { data, error } = await sb.rpc('create_invite', { p_days: +$('#idays').value, p_uses: +$('#iuses').value });
    if (error) throw error;
    $('#inew').innerHTML = `<div class="card" style="box-shadow:none;border:1px solid var(--line);margin:12px 0 0">
      <div class="sm muted" style="margin-bottom:6px">Your new link. Tap Share to send it.</div>
      <input class="opt-in" readonly id="ilink" value="${esc(inviteUrl(data.token))}" onfocus="this.select()" aria-label="Invite link">
      <div class="row" style="margin-top:8px"><button class="btn" data-act="invite-share" data-tok="${esc(data.token)}">${icon('send', 16)} Share</button>
      <button class="btn ghost" data-act="invite-copy" data-tok="${esc(data.token)}">${icon('link', 16)} Copy link</button></div></div>`;
    loadInvites();
  } catch (e) { err.textContent = /invites|schema cache|function/i.test(e.message) ? 'Invite links need a database update first.' : e.message; }
  finally { btn.disabled = false; delete btn.dataset.busy; }
}
async function copyInvite(tok) {
  const url = inviteUrl(tok);
  try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (_) { prompt('Copy this link:', url); }
}
async function shareInvite(tok) {
  const url = inviteUrl(tok);
  if (navigator.share) {
    try { await navigator.share({ title: 'BC Dads Golf', text: 'Join us on BC Dads Golf', url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyInvite(tok);
}
async function revokeInvite(tok) {
  if (!confirm('Cancel this link? People who already joined with it stay in the group.')) return;
  const { error } = await sb.rpc('revoke_invite', { p_token: tok });
  if (error) return toastFail(error);
  toast('Link cancelled'); loadInvites();
}

// ---------- splash screens: the "how the app works" guide and later "what's new" screens
// The screens live in the database (table splashes), so a new "what's new" screen is just a new row. Each member can tick
// "Don't show again" per screen (table splash_hidden). A screen shows on every launch until its box is ticked.
// Everyone sees every new screen, and hiding one never hides another.
async function maybeShowSplash() {
  try {
    const [sq, hq] = await Promise.all([
      sb.from('splashes').select('id,kind,title,pages,created_at').order('created_at', { ascending: false }),
      sb.from('splash_hidden').select('splash_id'),
    ]);
    if (sq.error || hq.error) return; // before the database update there is simply no splash
    const hidden = new Set((hq.data || []).map(r => r.splash_id));
    const rank = x => (x.kind === 'howto' ? 0 : 1);
    const queue = (sq.data || []).filter(x => !hidden.has(x.id) && Array.isArray(x.pages) && x.pages.length)
      .sort((a, b) => rank(a) - rank(b) || String(b.created_at).localeCompare(String(a.created_at)));
    showNextSplash(queue);
  } catch (e) { console.warn('splash:', e.message); }
}
function showNextSplash(queue) {
  const next = queue.shift();
  if (next) splashModal(next, () => showNextSplash(queue));
}
function splashModal(sp, done) {
  const pages = sp.pages.slice(0, 8);
  let i = 0, closing = false;
  const bg = document.createElement('div'); bg.className = 'sp-bg';
  bg.innerHTML = `<div class="sp-card" role="dialog" aria-modal="true" aria-label="${esc(sp.title)}" tabindex="-1">
    <button class="sp-x" data-sp="close" aria-label="Close">${icon('x', 22)}</button>
    <div class="sp-kind">${esc(sp.title)}</div>
    <div class="sp-viewport"><div class="sp-track">${pages.map(p => `<section class="sp-page">
      <div class="sp-ic">${icon(ICONS[p.icon] ? p.icon : 'sparkle', 32)}</div><h2>${esc(p.title)}</h2><p>${esc(p.body)}</p></section>`).join('')}</div></div>
    <div class="sp-dots">${pages.map(() => '<i></i>').join('')}</div>
    <label class="sp-check"><input type="checkbox" id="sp-hide"><span>Don't show this again</span></label>
    <button class="btn sp-next" data-sp="next"></button></div>`;
  document.body.appendChild(bg);
  const track = $('.sp-track', bg), dots = [...bg.querySelectorAll('.sp-dots i')], nextBtn = $('.sp-next', bg);
  const show = n => {
    i = Math.max(0, Math.min(pages.length - 1, n));
    track.style.transform = `translateX(${-100 * i}%)`;
    dots.forEach((d, k) => d.classList.toggle('on', k === i));
    nextBtn.textContent = i === pages.length - 1 ? 'Done' : 'Next';
  };
  show(0);
  requestAnimationFrame(() => bg.classList.add('in'));
  setTimeout(() => $('.sp-card', bg).focus({ preventScroll: true }), 300); // focus the card, not a button, so no outline shows

  const close = async () => {
    if (closing) return; closing = true;
    document.removeEventListener('keydown', onKey);
    if ($('#sp-hide', bg).checked) {
      const { error } = await sb.from('splash_hidden').insert({ member_id: uid(), splash_id: sp.id });
      if (error && error.code !== '23505') toast("Couldn't save that. It will show again next time.");
    }
    bg.classList.remove('in'); setTimeout(() => { bg.remove(); done(); }, 260);
  };
  const onKey = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') show(i + 1); else if (e.key === 'ArrowLeft') show(i - 1); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('click', e => {
    const a = e.target.closest('[data-sp]'); if (!a) return;
    if (a.dataset.sp === 'close') close();
    else if (i === pages.length - 1) close(); else show(i + 1);
  });
  // swipe the pages
  let x0 = null, y0 = 0, dx = 0, locked = false;
  const vp = $('.sp-viewport', bg);
  vp.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; locked = false; track.style.transition = 'none'; }, { passive: true });
  vp.addEventListener('touchmove', e => {
    if (x0 == null) return;
    dx = e.touches[0].clientX - x0;
    if (!locked && Math.abs(e.touches[0].clientY - y0) > Math.abs(dx) + 6) { x0 = null; track.style.transition = ''; show(i); return; }
    locked = true;
    const resist = (i === 0 && dx > 0) || (i === pages.length - 1 && dx < 0) ? .3 : 1;
    track.style.transform = `translateX(calc(${-100 * i}% + ${dx * resist}px))`;
  }, { passive: true });
  vp.addEventListener('touchend', () => {
    if (x0 == null) return; track.style.transition = '';
    if (dx < -50) show(i + 1); else if (dx > 50) show(i - 1); else show(i);
    x0 = null;
  });
}

// ---------- features
async function renderFeatures(r) {
  shell(r, `<div id="fv">${feedSkeleton()}</div>`);
  try {
    const [ov, fs] = await Promise.all([
      sb.from('overview').select('body,updated_at').eq('id', 1).maybeSingle(),
      sb.from('features').select('*').order('created_at', { ascending: false }),
    ]);
    if (ov.error) throw ov.error; if (fs.error) throw fs.error;
    const body = ov.data?.body;
    const counts = {}, ids = fs.data.map(f => f.idea_id).filter(Boolean);
    if (ids.length) { const cq = await sb.from('comments').select('idea_id').in('idea_id', ids).limit(5000); if (!cq.error) for (const c of cq.data) counts[c.idea_id] = (counts[c.idea_id] || 0) + 1; }
    const fv = $('#fv'); if (!fv) return;
    fv.innerHTML = `<h2 style="margin:6px 4px 10px">What the app can do</h2>
      <div class="ai-card"><div class="ai-head">${avatar('', 26, true)}<b>Overview</b></div>
        ${body ? `<div style="white-space:pre-wrap">${esc(body)}</div>` : `<div class="muted">Nothing is built yet. When an idea is built it shows up here, with a link to the conversation that shaped it.</div>`}</div>
      ${fs.data.map(f => `<div class="f-card"><div class="p-head" style="margin:0 0 4px"><h3 style="flex:1">${esc(f.name)}</h3>${f.version ? `<span class="chip built">v${esc(f.version)}</span>` : ''}</div>
        <div style="white-space:pre-wrap;color:var(--ink2)">${esc(f.description)}</div>
        ${f.idea_id ? `<button class="f-link" data-go="#/create/features/${f.idea_id}">Open the discussion${counts[f.idea_id] ? ' · ' + counts[f.idea_id] + (counts[f.idea_id] === 1 ? ' comment' : ' comments') : ''} ${icon('right', 16)}</button>` : ''}</div>`).join('')}`;
  } catch (e) { toastFail(e); }
}

// ---------- one tap handler for the whole app
const ACT = {
  'new-idea': () => newIdeaSheet(),
  'sort-menu': () => toggleSortMenu(),
  'invite': () => inviteSheet(),
  'invite-make': a => makeInvite(a),
  'invite-share': a => shareInvite(a.dataset.tok),
  'invite-copy': a => copyInvite(a.dataset.tok),
  'invite-revoke': a => revokeInvite(a.dataset.tok),
  'new-poll': () => pollSheet(route().id),
  'send': () => sendComment(),
  'pick-photo': () => $('#cfile')?.click(),
  'rm-photo': a => { S.files.splice(+a.dataset.i, 1); drawThumbs(); $('#composer')?._sync(); },
  'cancel-reply': () => cancelReply(),
  'focus-composer': () => $('#ctext')?.focus(),
  'ai-refresh': () => askAI(route().id, { manual: true, force: true }),
  'del-idea': async () => {
    if (!confirm('Delete this idea and everything in it?')) return;
    const { error } = await sb.from('ideas').delete().eq('id', route().id);
    if (error) return toastFail(error);
    S.feed = null; go(backHash());
  },
};
document.addEventListener('click', e => {
  if (G_swipedEl && Date.now() - G_swipedAt < 350 && G_swipedEl.contains(e.target)) return; // that was the end of a swipe, not a tap
  if (!e.target.closest('.menu,[data-act="sort-menu"]')) closeSortMenu();
  const a = e.target.closest('[data-go],[data-act],[data-like],[data-vote],[data-reply],[data-spin],[data-more],[data-delpoll],[data-sort],[data-lb],[data-stop],[data-open]');
  if (!a) return;
  const d = a.dataset;
  if (d.go) return go(d.go);
  if (d.like) { const [k, id] = d.like.split(':'); return toggleLike(k, id); }
  if (d.vote) { const [p, o] = d.vote.split('|'); return vote(p, o); }
  if (d.reply) return startReply(d.reply);
  if (d.more) { S.open.add(d.more); return rerenderThread(); }
  if (d.delpoll) {
    return (async () => {
      if (!confirm('Delete this poll and its votes?')) return;
      const { error } = await sb.from('polls').delete().eq('id', d.delpoll);
      if (error) return toastFail(error);
      const r = route(); if (r.id) { await loadThread(r.id).catch(toastFail); rerenderThread(); } else refreshFeed();
    })();
  }
  if (d.sort) {
    S.sort = d.sort; try { localStorage.setItem('bdg.sort', d.sort); } catch (_) {}
    const f = $('#feed'); if (f) f.innerHTML = feedHTML(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  if (d.spin) return spinSheet(d.spin);
  if (d.lb) return lightbox(d.lb);
  if (d.act) return ACT[d.act] && ACT[d.act](a, e);
  if ('stop' in d) return; // taps inside a poll card do not open the idea
  if (d.open) return go('#/create/ideas/' + d.open);
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'ready') return;
  const id = route().id, on = e.target.checked;
  e.target.disabled = true;
  const { error } = await sb.rpc('set_ready', { p_idea_id: id, p_ready: on }); // records who set it, so the assistant never undoes it
  if (error) toastFail(error); else { S.feed = null; toast(on ? 'Marked ready to build' : 'Taken back to Open'); }
  await loadThread(id).catch(toastFail); rerenderThread();
});

// ---------- finger gestures
// Swipe right on a comment: reply. Swipe left on your own comment: delete. Double-tap: like.
// Swipe in from the left edge on an idea: back to the feed. Pull down at the top of the feed: refresh.
let G = null, G_swipedAt = 0, G_swipedEl = null, lastTap = { el: null, t: 0 };
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || e.target.closest('.sheet-bg,.sp-bg,.lb,.composer,header')) { G = null; return; }
  const t = e.touches[0], r = route();
  G = { x0: t.clientX, y0: t.clientY, dx: 0, dy: 0, lock: null, moved: false, type: null };
  if (r.id && t.clientX < 28) G.type = 'edge';
  else if (e.target.closest('.c-row')) { G.type = 'row'; G.row = e.target.closest('.c-row'); G.main = G.row.querySelector('.c-main'); }
  else if (!r.id && r.mode === 'create' && r.tab === 'ideas' && window.scrollY <= 0) G.type = 'pull';
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!G || !G.type) return;
  const t = e.touches[0]; G.dx = t.clientX - G.x0; G.dy = t.clientY - G.y0;
  if (!G.lock && (Math.abs(G.dx) > 8 || Math.abs(G.dy) > 8)) { G.lock = Math.abs(G.dx) > Math.abs(G.dy) ? 'x' : 'y'; G.moved = true; }
  if (G.type === 'row' && G.lock === 'x') {
    const canLeft = !!G.row.dataset.mine;
    const d = Math.max(canLeft ? -84 : 0, Math.min(84, G.dx * .6));
    G.main.style.transition = 'none'; G.main.style.transform = `translateX(${d}px)`;
    G.row.classList.toggle('arm-r', G.dx > 70); G.row.classList.toggle('arm-l', canLeft && G.dx < -70);
  } else if (G.type === 'edge' && G.lock === 'x' && G.dx > 0) {
    const tv = $('#tv'); if (tv) { tv.style.transition = 'none'; tv.style.transform = `translateX(${G.dx * .55}px)`; tv.style.opacity = String(Math.max(.4, 1 - G.dx / 600)); }
  } else if (G.type === 'pull' && G.lock === 'y' && G.dy > 0 && window.scrollY <= 0) {
    const p = $('#ptr'); if (p) { const h = Math.min(90, G.dy * .45); p.style.transition = 'none'; p.style.height = h + 'px'; p.classList.toggle('arm', h > 58); }
  }
}, { passive: true });
document.addEventListener('touchend', e => {
  const g = G; G = null;
  if (g && g.moved) { G_swipedAt = Date.now(); G_swipedEl = g.type === 'row' ? g.row : g.type === 'edge' ? $('#tv') : g.type === 'pull' ? $('main') : null; }
  if (g && g.type === 'row') {
    g.main.style.transition = ''; g.main.style.transform = '';
    const armR = g.row.classList.contains('arm-r'), armL = g.row.classList.contains('arm-l');
    g.row.classList.remove('arm-r', 'arm-l');
    if (g.lock === 'x' && armR) { haptic(); startReply(g.row.dataset.cid); }
    else if (g.lock === 'x' && armL) { haptic(); delComment(g.row.dataset.cid); }
  }
  if (g && g.type === 'edge') {
    const tv = $('#tv'); if (tv) { tv.style.transition = 'transform .2s, opacity .2s'; tv.style.transform = ''; tv.style.opacity = ''; }
    if (g.lock === 'x' && g.dx > 90) { haptic(); go(backHash()); }
  }
  if (g && g.type === 'pull') {
    const p = $('#ptr');
    if (p) {
      p.style.transition = '';
      if (p.classList.contains('arm')) {
        p.classList.remove('arm'); p.classList.add('spin'); p.style.height = '48px'; haptic();
        refreshFeed().finally(() => { p.classList.remove('spin'); p.style.height = '0'; });
      } else p.style.height = '0';
    }
  }
  // double-tap to like (only when the finger did not move)
  if (g && g.moved) return;
  const el = e.target.closest && e.target.closest('[data-dbl]');
  if (!el) { lastTap = { el: null, t: 0 }; return; }
  const now = Date.now();
  if (lastTap.el === el && now - lastTap.t < 320) {
    lastTap = { el: null, t: 0 }; e.preventDefault();
    const [k, id] = el.dataset.dbl.split(':'); burst(el); toggleLike(k, id, true);
  } else lastTap = { el, t: now };
});
document.addEventListener('dblclick', e => { // mouse: double-click to like
  const el = e.target.closest('[data-dbl]'); if (!el) return;
  const [k, id] = el.dataset.dbl.split(':'); burst(el); toggleLike(k, id, true);
});

// ---------- getting new versions onto the phone quickly
// A Home Screen app can sit in the background for days without reloading. So: check for a new version whenever the app
// comes back to the front (and every 30 minutes while open). When a new version has installed, reload once, waiting
// until nothing is being typed, posted or uploaded, so nothing you're doing gets lost.
const hadSW = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
let swReg = null, updWait = 0, updLast = 0;
function busy() {
  if ($('.sheet-bg') || $('.sp-bg') || $('[data-busy]')) return true;
  return [...document.querySelectorAll('textarea, input[type=text], input:not([type])')].some(el => el.value.trim());
}
function watchForUpdates() {
  const check = () => { if (Date.now() - updLast < 60000) return; updLast = Date.now(); swReg.update().catch(() => {}); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setInterval(() => { if (!document.hidden) check(); }, 30 * 60000);
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadSW || updWait) return; // first install: nothing to refresh
    const reload = () => { if (busy()) return; clearInterval(updWait); location.reload(); };
    updWait = setInterval(reload, 1500); reload();
  });
}
async function swInit() {
  if (!('serviceWorker' in navigator)) return;
  try { swReg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }); } catch (e) { return; }
  watchForUpdates();
}

boot();
swInit();
})();
